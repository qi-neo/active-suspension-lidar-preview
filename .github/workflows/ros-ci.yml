name: ROS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 容器 job 的默认 shell 是 sh（dash），不支持 `set -o pipefail`。
# 本工作流的步骤里用了 pipefail（配合 tee 保留失败码），必须显式用 bash。
defaults:
  run:
    shell: bash

# 失败时要把日志贴回 PR，需要写 issue comment 权限
permissions:
  contents: read
  pull-requests: write
  actions: read

# 同一分支上新的推送取消正在跑的旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: colcon build + 离线自检 (ROS ${{ matrix.ros_distribution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distribution: [humble]

    # 用 ROS 容器而不是在 runner 上装 ROS：容器是 Ubuntu 22.04，
    # 不受 runner 镜像升级影响，且省掉一大段安装步骤
    container:
      image: ros:${{ matrix.ros_distribution }}-ros-base

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # colcon 会递归扫描 src/ 找包，所以放在子目录里也能被发现
          path: src/active-suspension-lidar-preview

      # rosdep 的唯一依据是 package.xml。CMakeLists 里 find_package 了但
      # package.xml 没声明的，本机往往看不出来（别的包或全局环境已经装上），
      # 到了干净环境里 rosdep 不装它才炸——本仓库已经因为这类脱节踩过
      # geometry_msgs 与 libpcl-all-dev 两次。这里加一道纯文本检查，
      # 比等 colcon 报错早得多，也不额外花时间。
      - name: CMakeLists 与 package.xml 对齐
        working-directory: src/active-suspension-lidar-preview
        run: python3 tools/check_deps.py 2>&1 | tee /tmp/check_deps.log

      # ROS2 里 YAML 键名是纯字符串匹配：键写错、或改了参数名没同步 YAML，
      # 结果都是参数被静默忽略——节点照常启动、跑起来却用着默认值。
      # 这个检查零耗时，放在构建之前，漂移在 5 分钟的编译前就暴露
      - name: 参数声明与 YAML 键一一对应
        working-directory: src/active-suspension-lidar-preview
        run: python3 src/suspension_control_v3/tools/check_ros_params.py 2>&1 | tee /tmp/check_params.log

      - name: 安装构建与依赖工具
        run: |
          set -eo pipefail
          {
          echo "== apt-get update =="
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-pip
          rosdep init || true
          rosdep update
          } 2>&1 | tee /tmp/apt.log

      - name: rosdep 安装依赖
        run: |
          set -eo pipefail
          {
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          rosdep install --from-paths src --ignore-src -r -y --skip-keys libpcl-all-dev
          # libpcl-all-dev 在部分平台没有对应 rosdep 条目，单独装
          apt-get install -y --no-install-recommends libpcl-dev || true
          } 2>&1 | tee /tmp/rosdep.log

      - name: colcon build
        run: |
          set -eo pipefail
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          # tee 到文件：失败时由下面的步骤把日志贴回 PR（本机没有 ROS/容器时，
          # Actions 日志需要认证才能看，这是唯一不依赖本地环境的定位手段）
          colcon build \
            --packages-select suspension_preview suspension_preview_v2 \
                             suspension_control_v3 unilidar_driver car_balancer \
            --cmake-args -Wall -Wextra -Wpedantic \
            --event-handlers console_cohesion+ 2>&1 | tee /tmp/colcon.log
          # 以前这一句是 `colcon test-result --verbose || true`：从没跑过 test，
          # test-result 只是把"没有测试结果"打印出来而已。现在 v3 与 v2 都注册了
          # CTest，这里真的跑一遍并且不容忍失败
          colcon test --packages-select suspension_control_v3 suspension_preview_v2 \
            --event-handlers console_direct+ \
            --return-code-on-test-failure 2>&1 | tee /tmp/test.log
          colcon test-result --verbose | tee -a /tmp/test.log

      # 三个包都有不依赖 ROS 的离线自检，在这里真正跑一遍，
      # 确认控制逻辑与解析逻辑在 CI 上仍然是通的
      - name: v3 控制与安全逻辑自检（443 项）
        run: |
          set -e
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          . install/setup.sh
          ros2 run suspension_control_v3 control_selftest

      - name: 驱动报文解析自检（135 项）
        run: |
          set -e
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          . install/setup.sh
          ros2 run unilidar_driver decoder_selftest

      # 串口接收：PTY 主从对造虚拟串口，不依赖真雷达也不依赖真串口。
      # 容器里同样能跑——Linux PTY 从端输入队列约 4 KB，一帧整包 1044 B
      # 放得下（macOS 队列只有约 512 B，主端写在从端读之前会阻塞，那是
      # 本机自检才需要 pushAndPump 边写边读的原因）。这一步在独立仓库
      # unilidar-driver 的 core job 里也跑（双编译器 × ASan），两边都门住。
      - name: 驱动串口接收自检（63 项）
        run: |
          set -e
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          . install/setup.sh
          ros2 run unilidar_driver serial_receiver_selftest

      # 这三个自检是纯函数、不依赖 PCL，此前一直没进 CI——
      # install(TARGETS) 里装了可执行，却没有任何步骤调用它
      - name: v2 纯函数自检（196 项）
        run: |
          set -e
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          . install/setup.sh
          for t in trend_selftest obstacle_selftest protocol_selftest param_selftest; do
            echo "--- $t ---"
            ros2 run suspension_preview_v2 "$t"
          done

      # 雷达是竖直安装的，车体 z 与真实竖直差几十度。这一步用重力向量做施密特
      # 正交化，把"水平"真正定义出来——点云的 z 从此是离地高度，不是车身某根轴
      - name: 虚拟水平面标定自检（69 项）
        run: |
          set -e
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          . install/setup.sh
          ros2 run suspension_preview_v2 level_selftest

      # 这段以前带 || true，等于"解析链路回归不阻塞 CI"。根因是 demo 只把
      # 协议往返的结果写进退出码，解析精度只打印——现在它自己也门住精度了，
      # 所以这里不再容忍失败
      - name: v2 点云解析链路（合成点云 vs 真值）
        run: |
          set -e
          . /opt/ros/${{ matrix.ros_distribution }}/setup.sh
          . install/setup.sh
          ros2 run suspension_preview_v2 offline_demo

      # 构建/测试失败时，把日志作为 PR 评论回传。
      # 动机：开发机没有 ROS/Docker，Actions 日志要认证才能看——这是唯一
      # 不依赖本地环境的失败定位手段（以后任何 CI 回归都能自查）。
  # 失败后回传日志：必须是独立 job（needs build）。在 build 自己的步骤里回传时
  # 它还没结束，拿不到完整日志；这里 job 已结束，可以下载到全部输出。
  # 动机：开发机没有 ROS/Docker，Actions 网页日志要认证，跑挂了只能看"红"。
  report-failure:
    name: 回传失败日志
    needs: [build]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 下载 build 日志并评论到 PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          API="https://api.github.com"
          JOBS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "$API/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")
          JOB_ID=$(echo "$JOBS" | jq -r '.jobs[] | select(.name | contains("colcon build")) | .id' | head -1)
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "找不到 build job"; exit 0
          fi
          echo "job id = $JOB_ID"
          # 先取 302 的 Location，再匿名下载（避免把 token 带给存储域名）
          LOC=$(curl -sS -o /dev/null -w '%{redirect_url}' \
            -H "Authorization: Bearer $GH_TOKEN" "$API/repos/$REPO/actions/jobs/$JOB_ID/logs")
          if [ -z "$LOC" ]; then echo "拿不到日志地址"; exit 0; fi
          curl -sSL "$LOC" -o /tmp/joblog.txt
          echo "log bytes: $(wc -c < /tmp/joblog.txt)"
          tail -300 /tmp/joblog.txt > /tmp/tail.txt
          jq -Rs '{body: ("## CI 失败日志（自动回传）\n\n完整日志尾部 300 行：\n```\n" + . + "\n```")}' \
            /tmp/tail.txt > /tmp/body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "$API/repos/$REPO/issues/$PR/comments" -d @/tmp/body.json
          echo "comment posted"

  # 覆盖率。单独 job：插桩要改编译 flag，且 -O0 + --coverage 与 sanitizer 不共存。
  #
  # 目的是**用数据找没被测到的代码**，而不是刷高数字。本地实测当前水位：
  #   attitude_filter / road_trend / obstacle_detect  100%
  #   controller 96.7  input_validator 94.9  safety_state_machine 94.9
  #   protocol 96.4   control_loop 95.7   temporal_fuser 90.9（最低）
  # --fail-under-line 80 只兜"大面积没测"这种 catastrophic 情况：门限高了会逼着
  # 人写没意义的断言，而且新模块刚进来时必然踩线。要提水位看 HTML 明细，
  # 不要靠抬门限。
  coverage:
    name: 覆盖率（找出没被测到的代码）
    runs-on: ubuntu-latest
    container:
      image: ros:humble-ros-base
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: src/active-suspension-lidar-preview

      - name: 安装工具
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends g++ python3-pip
          # Humble 容器是 Ubuntu 22.04，自带 pip 22.0.2：它不认识 --break-system-packages
          # （那是 pip 23 才加的，对应 PEP 668 的 externally-managed 保护）。
          # 反过来 24.04 及以后必须加这个参数才肯装进系统 Python。两条都试一遍，
          # 免得基础镜像一升级就挂在这行上。
          pip3 install gcovr 2>/dev/null || pip3 install --break-system-packages gcovr

      - name: 插桩构建并运行四个自检
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          mkdir -p build-cov
          # v3：整个控制与安全内核（一条命令编完六个源文件）
          g++ -std=c++17 -O0 --coverage \
            -I src/suspension_control_v3/include -I src/suspension_preview_v2/include \
            src/suspension_control_v3/examples/control_selftest.cpp \
            src/suspension_control_v3/src/input_validator.cpp \
            src/suspension_control_v3/src/controller.cpp \
            src/suspension_control_v3/src/attitude_filter.cpp \
            src/suspension_control_v3/src/safety_state_machine.cpp \
            src/suspension_control_v3/src/control_loop.cpp \
            src/suspension_control_v3/src/temporal_fuser.cpp \
            src/suspension_control_v3/src/param_check.cpp \
            src/suspension_control_v3/src/command_sink.cpp \
            -o build-cov/control_selftest
          ./build-cov/control_selftest > /dev/null
          # v2：四个纯函数自检，与 PCL 无关
          for pair in \
            "trend_selftest:road_trend.cpp" \
            "obstacle_selftest:obstacle_detect.cpp" \
            "protocol_selftest:protocol.cpp" \
            "level_selftest:level_calibration.cpp"; do
            name="${pair%%:*}"
            src="${pair##*:}"
            g++ -std=c++17 -O0 --coverage -I src/suspension_preview_v2/include \
              "src/suspension_preview_v2/examples/${name}.cpp" \
              "src/suspension_preview_v2/src/${src}" -o "build-cov/${name}"
            "./build-cov/${name}" > /dev/null
          done
          # 参数校验器也要跑，否则它在预览包的分母里贡献 0 覆盖。
          # 但 serial_port.cpp 是纯 termios I/O：离线自检只能覆盖到
          # is_baud_supported，实测 7% 行 / 3.5% 分支，插桩进来会把分支门禁
          # 直接拖穿（本地复算：其余文件全在 94~100%）。所以它**不插桩**，
          # 只作为链接依赖参与，不进分母。
          g++ -std=c++17 -O0 -I src/suspension_preview_v2/include \
            -c src/suspension_preview_v2/src/serial_port.cpp \
            -o build-cov/serial_port_noinstr.o
          g++ -std=c++17 -O0 --coverage -I src/suspension_preview_v2/include \
            src/suspension_preview_v2/examples/param_selftest.cpp \
            src/suspension_preview_v2/src/param_check.cpp \
            build-cov/serial_port_noinstr.o -o build-cov/param_selftest
          ./build-cov/param_selftest > /dev/null

      - name: 汇总覆盖率
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          # --filter 只统计项目自己的代码：系统头文件的覆盖率（动辄 28%）没有意义
          #
          # 门槛按实测值留出余量：行 95.9%、分支 74.0%，取 80 / 70。
          # 行覆盖单看会被"新增的大段直线代码"稀释，分支覆盖才能反映异常路径有没有
          # 被测到——校验器的九类拒绝、状态机的降级跳转，全在分支上。
          gcovr -r . build-cov \
            --filter 'src/suspension_control_v3/src/' \
            --filter 'src/suspension_control_v3/include/' \
            --filter 'src/suspension_preview_v2/src/' \
            --filter 'src/suspension_preview_v2/include/' \
            --txt --print-summary \
            --fail-under-line 80 \
            --fail-under-branch 70

      - name: 生成 HTML 明细
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          # 与上面「汇总覆盖率」用同一组 filter。原来这里写的是整个包目录，把
          # examples/*_selftest.cpp 也算了进去——测试自身的断言分支上千个，会把
          # 分母撑大，分支覆盖从 74% 掉到 57%，artifact 与门槛两个口径互相打架。
          gcovr -r . build-cov \
            --filter 'src/suspension_control_v3/src/' \
            --filter 'src/suspension_control_v3/include/' \
            --filter 'src/suspension_preview_v2/src/' \
            --filter 'src/suspension_preview_v2/include/' \
            --html-details --html-title "主动悬架 代码覆盖率" -o build-cov/coverage.html

      - name: 上传覆盖率明细
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: src/active-suspension-lidar-preview/build-cov/coverage.html
          if-no-files-found: error
