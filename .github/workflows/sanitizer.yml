# 内存与未定义行为检查（ASan + UBSan）
#
# 为什么单独成一个 workflow 而不是 ros-ci.yml 里的一个 job：
# GitHub 的 workflow 徽章只能对应"整个 workflow"，没有"单个 job 的徽章"。
# 拆出来之后 README 里的 ASan 徽章是**真的**只反映 sanitizer 状态，
# 而不是拿整体 CI 状态冒充。
#
# 只编"不依赖 ROS 与 PCL"的离线自检，直接用 g++ 而不走 colcon：
#   - 这些自检才是真正跑控制逻辑与解析逻辑的地方，bug 只可能在这里
#   - 不拉 PCL，整个 job 十几秒就跑完，不占额度
#   - 插桩要改编译 flag，与常规构建产物混在一起会互相污染
# 已经抓到过东西：用 999 当"无凸起"哨兵去索引 100 格数组，堆溢出，
# 而当时 234 项断言是全过的——断言验的是"值对不对"，验不出"写没写错地方"
name: ASan + UBSan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 容器 job 的默认 shell 是 sh（dash），不支持 `set -o pipefail`
defaults:
  run:
    shell: bash

# 失败时要把日志贴回 PR，需要写 issue comment 权限
permissions:
  contents: read
  pull-requests: write
  actions: read

# 同一分支上新的推送取消正在跑的旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: ASan + UBSan（离线自检）
    runs-on: ubuntu-latest
    container:
      # 直接写死而不是用 ${{ matrix.* }}：本 job 没有 strategy.matrix，
      # 引用它会展开成 ros:-ros-base 这种空镜像名，整个 job 起不来
      image: ros:humble-ros-base
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: src/active-suspension-lidar-preview

      - name: 安装编译器
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends g++

      - name: v3 控制与安全逻辑（ASan + UBSan）
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -I src/suspension_control_v3/include -I src/suspension_preview_v2/include \
            src/suspension_control_v3/examples/control_selftest.cpp \
            src/suspension_control_v3/src/input_validator.cpp \
            src/suspension_control_v3/src/controller.cpp \
            src/suspension_control_v3/src/attitude_filter.cpp \
            src/suspension_control_v3/src/safety_state_machine.cpp \
            src/suspension_control_v3/src/control_loop.cpp \
            src/suspension_control_v3/src/temporal_fuser.cpp \
            src/suspension_control_v3/src/param_check.cpp \
            src/suspension_control_v3/src/command_sink.cpp \
            -o /tmp/asan_control
          /tmp/asan_control

      # v2 四个纯函数自检同样过一遍。它们与 PCL 无关，只需 v2 的 include 目录
      - name: v2 纯函数自检（ASan + UBSan）
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          for pair in \
            "trend_selftest:road_trend.cpp" \
            "obstacle_selftest:obstacle_detect.cpp" \
            "protocol_selftest:protocol.cpp" \
            "level_selftest:level_calibration.cpp"; do
            name="${pair%%:*}"
            src="${pair##*:}"
            echo "--- $name ---"
            g++ -std=c++17 -g -O1 -fsanitize=address,undefined \
              -fno-omit-frame-pointer -I src/suspension_preview_v2/include \
              "src/suspension_preview_v2/examples/${name}.cpp" \
              "src/suspension_preview_v2/src/${src}" \
              -o "/tmp/asan_${name}"
            "/tmp/asan_${name}"
          done

      # param_selftest 依赖两个源文件（参数校验 + 串口能力查询），单独编
      - name: v2 参数校验自检（ASan + UBSan）
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I src/suspension_preview_v2/include \
            src/suspension_preview_v2/examples/param_selftest.cpp \
            src/suspension_preview_v2/src/param_check.cpp \
            src/suspension_preview_v2/src/serial_port.cpp \
            -o /tmp/asan_param_selftest
          /tmp/asan_param_selftest

      # 驱动侧串口接收：PTY 主从对虚拟串口 + ASan/UBSan。SerialReceiver 走的是
      # 与 /dev/ttyUSB0 完全相同的 termios 路径，这段代码同样要过 sanitizer——
      # 断言只验"值对不对"，验不出"写没写错地方"。与独立仓库 unilidar-driver
      # 的 core job（双编译器 × ASan）互为双保险
      - name: 驱动串口接收自检（ASan + UBSan）
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror \
            -I src/unilidar_driver/include \
            src/unilidar_driver/examples/serial_receiver_selftest.cpp \
            src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/serial_receiver.cpp \
            -o /tmp/asan_serial_receiver
          ASAN_OPTIONS=detect_leaks=1 /tmp/asan_serial_receiver

  # 失败后回传日志：必须是独立 job（needs: [sanitize]）。在 sanitize 自己的步骤里
  # 回传时它还没结束，拿不到完整日志；这里 job 已结束，可以下载到全部输出。
  # 动机：开发机没有 ROS/Docker，Actions 网页日志要认证，跑挂了只能看"红"。
  # 与 ros-ci.yml 里的回传逻辑一致；改一处记得改另一处。
  report-failure:
    name: 回传失败日志
    needs: [sanitize]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 下载 ASan 日志并评论到 PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          API="https://api.github.com"
          JOBS=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "$API/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")
          JOB_ID=$(echo "$JOBS" | jq -r '.jobs[] | select(.name | contains("ASan")) | .id' | head -1)
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "找不到 ASan job"; exit 0
          fi
          echo "job id = $JOB_ID"
          # 先取 302 的 Location，再匿名下载（避免把 token 带给存储域名）
          LOC=$(curl -sS -o /dev/null -w '%{redirect_url}' \
            -H "Authorization: Bearer $GH_TOKEN" "$API/repos/$REPO/actions/jobs/$JOB_ID/logs")
          if [ -z "$LOC" ]; then echo "拿不到日志地址"; exit 0; fi
          curl -sSL "$LOC" -o /tmp/joblog.txt
          echo "log bytes: $(wc -c < /tmp/joblog.txt)"
          tail -300 /tmp/joblog.txt > /tmp/tail.txt
          jq -Rs '{body: ("## ASan/UBSan 失败日志（自动回传）\n\n完整日志尾部 300 行：\n```\n" + . + "\n```")}' \
            /tmp/tail.txt > /tmp/body.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
            "$API/repos/$REPO/issues/$PR/comments" -d @/tmp/body.json
          echo "comment posted"
