# 内存与未定义行为检查（ASan + UBSan）
#
# 为什么单独成一个 workflow 而不是 ros-ci.yml 里的一个 job：
# GitHub 的 workflow 徽章只能对应"整个 workflow"，没有"单个 job 的徽章"。
# 拆出来之后 README 里的 ASan 徽章是**真的**只反映 sanitizer 状态，
# 而不是拿整体 CI 状态冒充。
#
# 只编"不依赖 ROS 与 PCL"的离线自检，直接用 g++ 而不走 colcon：
#   - 这些自检才是真正跑控制逻辑与解析逻辑的地方，bug 只可能在这里
#   - 不拉 PCL，整个 job 十几秒就跑完，不占额度
#   - 插桩要改编译 flag，与常规构建产物混在一起会互相污染
# 已经抓到过东西：用 999 当"无凸起"哨兵去索引 100 格数组，堆溢出，
# 而当时 234 项断言是全过的——断言验的是"值对不对"，验不出"写没写错地方"
name: ASan + UBSan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 容器 job 的默认 shell 是 sh（dash），不支持 `set -o pipefail`
defaults:
  run:
    shell: bash

# 失败时要把日志贴回 PR，需要写 issue comment 权限
permissions:
  contents: read
  pull-requests: write
  actions: read

# 同一分支上新的推送取消正在跑的旧任务，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: ASan + UBSan（离线自检）
    runs-on: ubuntu-latest
    container:
      # 直接写死而不是用 ${{ matrix.* }}：本 job 没有 strategy.matrix，
      # 引用它会展开成 ros:-ros-base 这种空镜像名，整个 job 起不来
      image: ros:humble-ros-base
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          path: src/active-suspension-lidar-preview
          # 驱动自检的源码在 submodule 里，必须一并拉下来
          submodules: recursive

      - name: 安装编译器
        run: |
          set -e
          apt-get update
          apt-get install -y --no-install-recommends g++

      # v3 内核 + v2 纯函数自检：命令与源清单全部收敛到 tools/build_selftest.sh
      # 与 tools/selftest_sources.sh（P1-1）。新增 .cpp 只改 selftest_sources.sh 一处。
      - name: v3 + v2 离线自检（ASan + UBSan；单一真源 tools/build_selftest.sh）
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          bash tools/build_selftest.sh sanitize

      # 驱动侧串口接收：PTY 主从对虚拟串口 + ASan/UBSan。SerialReceiver 走的是
      # 与 /dev/ttyUSB0 完全相同的 termios 路径，这段代码同样要过 sanitizer——
      # 断言只验"值对不对"，验不出"写没写错地方"。与独立仓库 unilidar-driver
      # 的 core job（双编译器 × ASan）互为双保险
      - name: 驱动串口接收自检（ASan + UBSan；81 项）
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror \
            -I src/unilidar_driver/src/unilidar_driver/include \
            src/unilidar_driver/src/unilidar_driver/examples/serial_receiver_selftest.cpp \
            src/unilidar_driver/src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/unilidar_driver/src/serial_receiver.cpp \
            -o /tmp/asan_serial_receiver
          ASAN_OPTIONS=detect_leaks=1 /tmp/asan_serial_receiver

      # UDP 接收同样过 sanitizer：socket 的 bind/setsockopt/recvfrom/sendto
      # 路径要查越界与 UB，超时与 close 幂等分支也要守住
      - name: 驱动 UDP 接收自检（ASan + UBSan；38 项）
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror \
            -I src/unilidar_driver/src/unilidar_driver/include \
            src/unilidar_driver/src/unilidar_driver/examples/udp_receiver_selftest.cpp \
            src/unilidar_driver/src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/unilidar_driver/src/udp_receiver.cpp \
            -o /tmp/asan_udp_receiver
          ASAN_OPTIONS=detect_leaks=1 /tmp/asan_udp_receiver

      # 压力灌入同样过 sanitizer：3 秒 2 Mbps 灌入 + 垃圾注入 + 读暂停，
      # 校验缓冲边界写入与 erase 后的越界访问。packet_parser 的 pos 重置
      # bug 就是压力测试最先发现的，插桩版要能守住这条路径
      - name: 驱动串口压力自检（ASan + UBSan；14 项，2 Mbps 灌入 3 s）
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror \
            -I src/unilidar_driver/src/unilidar_driver/include \
            src/unilidar_driver/src/unilidar_driver/examples/serial_stress_selftest.cpp \
            src/unilidar_driver/src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/unilidar_driver/src/serial_receiver.cpp \
            -o /tmp/asan_serial_stress
          ASAN_OPTIONS=detect_leaks=1 /tmp/asan_serial_stress --seconds 3 --quiet

      # 主循环同样过 sanitizer：DriverLoop 的缓冲与拼帧路径要查越界与 UB
      - name: 驱动节点主循环自检（ASan + UBSan；65 项，2 Mbps 灌入 2 s）
        run: |
          set -e
          cd src/active-suspension-lidar-preview
          g++ -std=c++17 -g -O1 -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Wpedantic -Werror \
            -I src/unilidar_driver/src/unilidar_driver/include \
            src/unilidar_driver/src/unilidar_driver/examples/node_loop_selftest.cpp \
            src/unilidar_driver/src/unilidar_driver/src/protocol.cpp \
            src/unilidar_driver/src/unilidar_driver/src/packet_parser.cpp \
            src/unilidar_driver/src/unilidar_driver/src/frame_decoder.cpp \
            src/unilidar_driver/src/unilidar_driver/src/serial_receiver.cpp \
            src/unilidar_driver/src/unilidar_driver/src/driver_loop.cpp \
            -o /tmp/asan_node_loop
          ASAN_OPTIONS=detect_leaks=1 /tmp/asan_node_loop --seconds 2 --quiet

  # 失败后回传日志：必须是独立 job（needs: [sanitize]）。在 sanitize 自己的步骤里
  # 回传时它还没结束，拿不到完整日志；这里 job 已结束，可以下载到全部输出。
  # 逻辑已抽成 .github/actions/report-failure（P1-5），两个 workflow 共用同一份。
  report-failure:
    name: 回传失败日志
    needs: [sanitize]
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 回传 ASan 失败日志
        uses: ./.github/actions/report-failure
        with:
          run-id: ${{ github.run_id }}
          job-filter: "ASan"
          pr-number: ${{ github.event.pull_request.number }}
