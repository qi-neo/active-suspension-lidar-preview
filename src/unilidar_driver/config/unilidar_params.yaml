# Unitree L1 驱动参数。优先级：launch 传入 > 本文件 > 代码内默认值。
# 默认话题名与仓库内 v2 预瞄节点、v3 控制节点的订阅保持一致，可直接替换官方节点。
unilidar_driver_node:
  ros__parameters:
    # ---- 传输层 ----
    # serial：L1 原生 TTL UART 经 CH340 类模块转 USB（实物默认路径）。
    #   官方 SDK 默认波特率 2,000,000 bps，设备名通常 /dev/ttyUSB0；
    #   打不开时先确认用户已加入 dialout 组。
    # udp：L1 以太网口 192.168.1.62:6101 -> 本机 6201（备选路径）。
    #   此时下面「网络」小节的 local_ip / local_port / source_ip 与
    #   recv_buf_bytes 才生效；serial 时它们被忽略。
    transport: "serial"
    serial_device: "/dev/ttyUSB0"
    serial_baud: 2000000

    # ---- 网络（仅 transport=udp 时生效）----
    # 本机监听地址。留空则监听所有网卡，排查阶段建议先留空
    local_ip: ""
    local_port: 6201
    # 只接受来自这个地址的数据，留空表示不过滤
    source_ip: ""

    # ---- 话题与坐标系 ----
    cloud_frame: "unilidar_lidar"
    cloud_topic: "/unilidar/cloud"
    imu_frame: "unilidar_imu"
    imu_topic: "/unilidar/imu"

    # ---- 点云 ----
    # 多少条扫描线合成一帧点云。雷达约 180Hz 出扫描线，
    # 18 条约合 10Hz 的点云，与 v2 预瞄节点的输入节奏匹配。
    # 点云逐点 ring 字段的取值就是 1..cloud_scan_num（1 基线号）。
    cloud_scan_num: 18
    range_min: 0.0              # 有效最近距离 m
    range_max: 100.0            # 有效最远距离 m

    # ---- IMU ----
    # 固件里四元数分量的排列官方未定死，wxyz 或 xyzw。
    # 默认 xyzw：官方 ROS2 节点填 Imu 话题就是按 x,y,z,w 取的；
    # 同一文件广播 TF 时又按 w,x,y,z 取，官方自身矛盾。
    # 判定方法：雷达静止水平放置，打印出的 w 应接近 ±1 而其余接近 0
    quaternion_order: "xyzw"

    # true 用本机时间打时间戳，false 用雷达硬件时间戳
    use_system_timestamp: true

    # ---- 运行 ----
    publish_tf: true            # 广播 imu_frame -> cloud_frame 与实时姿态
    poll_period_ms: 2           # 轮询收包的周期
    recv_timeout_ms: 1          # 单次 recv 超时
    diag_period_s: 5.0          # 诊断日志周期

    # ---- 收包缓冲（仅 transport=udp 时生效）----
    # 请求的 SO_RCVBUF 字节数，0 表示沿用系统默认。雷达约 180 KB/s，
    # 内核默认 rmem 只有约 200 KB，调度抖动时会溢出丢包，所以默认请求 8 MiB。
    # 注意：Linux 会按 net.core.rmem_max 裁剪并把请求值翻倍，诊断日志里的
    # "SO_RCVBUF 实际 ... 字节" 才是生效值；若序号缺口持续增长就先调大它。
    recv_buf_bytes: 8388608
