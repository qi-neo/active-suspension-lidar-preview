# 闭环控制节点参数。优先级：launch 传入 > 本文件 > 代码内默认值
suspension_control_node:
  ros__parameters:
    # 输入输出话题
    profile_topic: "/suspension/road_profile"
    imu_topic: "/unilidar/imu"
    status_topic: "/suspension/control_status"

    # 控制环与状态上报频率
    control_rate_hz: 200.0
    status_rate_hz: 20.0
    # 单拍时长上限 (s)。定时抖动时不让累计时长一次跳过阈值，否则降级、
    # 链路超时这些"按持续时间"的判据会提前误触发
    max_step_dt: 0.05

    # 作动器。enable_driver 为 false 时只算不下发，便于纯软件联调
    enable_driver: true
    serial_port: "/dev/ttyS0"
    baud_rate: 115200

    # ---- 控制器 ----
    lookahead_m: 1.0                # 前馈取样距离 (m)，仅无车速信息时使用
    # 控制律：0 = 绝对式 PD（默认），1 = 增量式 LQI。
    # 切成 1 之前必须先把下面三个 LQI 增益填进来（用 tools/lqr_gain_design.py
    # 算），否则三个都是 0，控制器退化成"只前馈、不闭环"。
    # 节点在这种情况下会打 WARN，不会静默
    controller_kind: 0
    kp_roll: 250.0                  # mm/rad
    kd_roll: 30.0                   # mm/(rad/s)
    kp_pitch: 200.0
    kd_pitch: 25.0
    feedforward_gain: 1.0
    feedforward_sign: 1.0           # 依作动器安装方向在台架上确认正负
    height_limit_mm: 40.0           # 单轮行程限幅
    rate_limit_mm_per_s: 300.0      # 作动器速率限制

    # ---- 前馈取样距离（车速自适应）----
    # 有车速时：取样距离 = clamp(车速 × lookahead_time_s, min, max)；
    # 没有车速（未接 /odom 且 assume_speed_mps=0）时退回上面的 lookahead_m。
    # lookahead_time_s 取作动器走满行程耗时的 2.5 倍余量：
    #   height_limit_mm / rate_limit_mm_per_s × 2.5 = 40/300×2.5 ≈ 0.33 s
    use_speed_adaptive_lookahead: true
    speed_topic: "/odom"            # 车速来源（nav_msgs/Odometry，取 twist.linear.x）
    speed_timeout_s: 0.5            # 车速过期多久后视为无车速，退回固定 lookahead_m
    assume_speed_mps: 0.0           # >0 时按此恒定车速前馈，仅限无里程计的台架
    lookahead_time_s: 0.35          # 响应时域 (s)
    min_lookahead_m: 0.5            # 取样距离下限 (m)
    wheelbase_m: 0.25               # 轴距 (m)，后轴取样 = 前馈距离 - 轴距，需实测

    # ---- 姿态滤波 ----
    # 默认关闭多级链，走原有的一阶低通（1.0 = 直通）。上台架建议打开多级链，
    # 并按实测噪声水平重标死区——0.25° 是论文值，噪声大的 IMU 要调大
    attitude_filter_alpha: 1.0
    use_attitude_filter_chain: false
    attitude_gyro_alpha: 0.08       # 陀螺角速度 IIR
    attitude_accel_alpha: 0.05      # 姿态观测 IIR，兼作互补滤波校正权重
    attitude_smooth_window: 40      # 滑窗平均拍数（200 Hz 下 = 0.2 s）
    attitude_deadzone_deg: 0.25     # 软死区半宽（度），只作用于角度

    # ---- 语义预瞄：订阅 v2 的非地面障碍物，在该轮迹上放弃前馈 ----
    # 需要 v2 侧也在发布 /suspension/road_obstacles。默认关闭
    use_semantic_preview: false
    obstacles_topic: "/suspension/road_obstacles"
    obstacle_min_height_m: 0.05     # 高于地面多少才抑制 (m)，太低会把减速带也抑制掉
    obstacle_lateral_band_m: 0.15   # 判定"在本轮迹上"的横向半宽 (m)

    # ---- 预瞄前馈 FIR（替代单点比例取样）----
    # 权重来自 tools/lqr_gain_design.py 第七节（tau=0.05 s、200 Hz、12 拍窗），
    # 去掉泄漏尾伪影后归一化到直流增益 1.0。上台架需按实测作动器滞后重算：
    #   python3 tools/lqr_gain_design.py --actuator-tau <实测tau>
    # 注意 preview_start_m 替代了 lookahead_time_s 的作用——提前量该补偿
    # 作动器滞后，而不是"走满行程的耗时"
    use_preview_fir: false
    preview_start_m: 0.0            # FIR 起点相对帧龄补偿后当前位置的偏移 (m)
    preview_gains: [0.1202, 0.1169, 0.1122, 0.1066, 0.1000, 0.0929,
                    0.0853, 0.0778, 0.0703, 0.0627, 0.0552]   # 和为 1.0
    # 注意：这组权重是**时间域**的（第 j 拍 = j 个控制周期之后），落地时按
    # 车速×周期 换算成距离。所以窗的**空间**长度随车速变化：
    #   0.5 m/s -> 约 0.03 m；2 m/s -> 0.11 m；10 m/s -> 0.55 m
    # 时间长度恒为 11 拍（200 Hz 下 55 ms）。周期由 control_rate_hz 推出，
    # 不要另外配——两处写死迟早不一致，等于改了时间标度

    # ---- 多帧融合（跨帧按位置对齐后逐格取中位数）----
    # 单帧剖面会因点云稀疏在个别格上抖动，融合几帧能压掉这类单帧异常；
    # 融合只在有车速时成立（无车速无法对齐位置，会自动直通最新帧）
    fusion_frames: 3                # 参与融合的帧数（含最新帧）；1 = 关闭融合
    fusion_max_age_s: 0.3           # 参与融合的帧的最大帧龄 (s)
    fusion_max_dispersion_m: 0.03   # 同位置各帧读数 max-min 超此值判低置信、该格置无效
                                    # （宁可让前馈少用一格，也不拿互相矛盾的数据下指令）

    # ---- 增量式 LQI 增益（controller_kind=1 时生效，PD 模式下忽略）----
    # 控制律：u[k] = u[k-1] + kx1·Δθ + kx2·Δω + ki·θ
    # 积分作用来自 ki·θ 每拍累加，能压掉 PD 压不掉的常值横坡残留。
    # 默认 0 表示未整定；上车站架前必须先跑 lqr_gain_design.py
    lqi_kx1: 0.0
    lqi_kx2: 0.0
    lqi_ki: 0.0

    # ---- 输入校验（坏数据拒绝）----
    max_age_ms: 200.0               # 剖面最大有效期
    max_jump_m: 1.0                 # 相邻帧同一格的最大允许跳变
    min_quality: 40                 # 最低质量分
    height_abs_limit_m: 0.6         # 高程物理上限
    expected_frame: "base_link"
    nominal_spacing: 0.05
    nominal_wheel_dist: 0.6
    max_attitude_age_ms: 50.0       # 姿态最大有效期

    # ---- 安全状态机 ----
    calibrate_samples: 50           # 标定所需样本数
    calibrate_max_rate: 0.05        # 静止判定阈值 (rad/s)
    leveling_duration_s: 1.0        # 找平持续时间
    # 找平就绪判据：姿态误差（相对零位标定基准）小于它才算回中。
    # 只看时间的话，作动器还没走完就进闭环，闭环第一拍会把"没到位"当误差去修
    leveling_max_tilt_deg: 2.9      # 约 0.05 rad
    # 找平最长等待；超时仍未就绪转 Degraded（不允许永远停在 Leveling）
    leveling_max_wait_s: 2.0
    degrade_after_unhealthy_s: 0.15 # 连续不可信多久后降级
    recover_duration_s: 0.5         # 恢复正常多久后回闭环
    degraded_hold_timeout_s: 5.0    # 降级后保持多久仍未恢复则转急停回中
                                    # （不让作动器一直停在旧行程上）
    max_abs_roll_deg: 20.0          # 姿态安全阈值
    max_abs_pitch_deg: 20.0
    link_lost_timeout_s: 0.5        # 作动器链路中断多久后急停

    # ---- 作动器堵转（需驱动支持位置反馈才有意义）----
    stall_error_mm: 8.0             # 指令与实际位置偏差超过该值视为"跟不上"
    stall_degrade_after_s: 0.5      # 堵转持续多久后降级；降级后不复原则由
                                    # degraded_hold_timeout_s 接手转 Emergency
    # 位置来源可以是驱动轮询，也可以是外部桥接节点往话题上上报（两者互补，
    # 话题新鲜时优先）。过期后按无反馈处理
    position_timeout_s: 0.2         # 位置上报的最大有效期
    max_position_mm: 400.0         # 位置合理性上限，超过则忽略该包（行程的十倍量级）
    actuator_position_topic: "/suspension/actuator_position"   # Int32MultiArray，四轮 mm
