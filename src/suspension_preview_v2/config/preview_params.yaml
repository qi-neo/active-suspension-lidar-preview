# 路面预瞄节点参数。优先级：launch 传入 > 本文件 > 代码内默认值

road_preview_node:
  ros__parameters:
    # 输入 / 输出
    cloud_topic: "/unilidar/cloud"          # 点云话题
    target_frame: "base_link"               # 变换目标坐标系（车体）
    publish_topic: "/suspension/road_profile"  # 剖面输出话题（Marker 会加 _marker 后缀）

    # 串口（下行给悬架控制器）
    enable_serial: true                     # 纯软件调试时可设 false
    serial_port: "/dev/ttyS0"               # 香橙派上确认实际串口号
    baud_rate: 115200                       # 可升到 460800 / 921600 提高帧率

    # 几何 / 感知
    wheel_dist: 0.6                         # 左右轮间距 (m)
    lane_half_width: 0.1                    # 单条轮迹半宽 (m) → ROI 宽度 0.2 m
    preview_dist: 5.0                       # 预瞄距离 (m)
    resolution: 0.05                        # 纵向分辨率 (m) → 格数 = 5.0/0.05 = 100

    # 地面高程窗口。按 base_link 原点在地面投影处取值；若坐标系定义不同需相应调整
    ground_z_min: -0.40                     # 窗口下界 (m)
    ground_z_max: 0.10                      # 窗口上界 (m)
    mount_height: 0.20                      # 雷达安装高度 (m)，用于合理性校验

    # 鲁棒性
    min_points_per_cell: 3                  # 单格最少点数，不足判无效
    max_cell_spread: 0.15                   # 格内高低差阈值 (m)，超过判为障碍物
    use_median: true                        # 格内取中位数（抗离群点）
    interpolate_gaps: false                 # 是否线性插值补无效格（默认关闭，保留真实缺失）

    # 其它
    tf_timeout_ms: 30                       # TF 查询超时 (ms)
    publish_marker: true                    # 发布 rviz Marker
    diag_period_s: 5.0                      # 诊断日志周期 (s)
